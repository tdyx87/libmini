name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      BUILD_TYPE: Release
      # 冒烟消费者与安装树的构建目录（路径含空格风险，统一放工作区根下）
      PREFIX: ${{ github.workspace }}/smoke/prefix

    steps:
      - uses: actions/checkout@v4

      # Windows：激活 MSVC 开发环境（Ninja 生成器下 CMake 找不到 cl.exe，
      # 必须 vcvars 提供 INCLUDE/LIB/PATH）
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'

      - name: Install Conan
        run: pip install "conan>=2.0"

      - name: Configure Conan profile
        shell: bash
        run: |
          conan profile detect --force
          p="$(conan profile path default)"
          # 键必须插进已有的 [settings] 段（直接 append 会产生重复 section，
          # conan 直接报错）。注入全部做成幂等：新版 conan detect 可能已
          # 自带 cppstd（gnu14），重复插入会炸
          # compiler.cppstd 必须存在：cpp-httplib/spdlog 的配方会校验
          # 该设置（缺失直接拒装）。14 = gtest 1.15 最低要求（detect 已写
          # gnu14 的话直接用）；库本体仍按 CMAKE_CXX_STANDARD=11 编译
          if ! grep -q '^compiler.cppstd=' "$p"; then
            awk '/^\\[settings\\]$/{print; print "compiler.cppstd=14"; next} {print}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
          fi
          # Windows：静态运行库（MT），与 README「安装与分发」的消费要求一致；
          # 并显式声明 Ninja 生成器（conan 否则会把 VS toolset/-T x64 写进
          # toolchain，与 Ninja 生成器不兼容：CMP0091 + platform 报错）
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            if ! grep -q '^compiler.runtime=' "$p"; then
              awk '/^\\[settings\\]$/{print; print "compiler.runtime=static"; next} {print}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
            fi
            printf '\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja\n' >> "$p"
          fi
          conan profile show

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt') }}

      - name: Install dependencies (Conan)
        run: conan install . -of deps --build=missing -s build_type=Release


      - name: Configure (CMake + Ninja)
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=deps/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$PREFIX"
          -DLIBMINI_BUILD_SWF_VIEWER=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: CTest
        shell: bash
        run: >
          ctest --test-dir build --output-on-failure
          --timeout 600

      - name: Install to prefix
        run: cmake --install build

      - name: Smoke consumer (find_package + link + run)
        shell: bash
        # 路径全部用相对路径：在 bash 中展开绝对路径表达式时，
        # Windows 反斜杠会被 Git Bash 当转义序列吃掍，工具链路径全部失效
        run: |
          cmake -S ci/smoke_consumer -B smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=deps/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PREFIX"
          cmake --build smoke/build --parallel
          ./smoke/build/consumer
