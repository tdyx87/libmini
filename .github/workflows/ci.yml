name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 发布门禁：release.yml 用 needs 调用本工作流，要求 tag 提交全绿后才出包
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 三平台基线：Release 静态库
          - name: ubuntu-release
            os: ubuntu-latest
          - name: windows-release
            os: windows-latest
          - name: macos-release
            os: macos-latest
          # Debug 配置：断言与 STL 调试检查生效
          - name: ubuntu-debug
            os: ubuntu-latest
            build_type: Debug
          - name: windows-debug
            os: windows-latest
            build_type: Debug
          # Shared 变体：DLL/SO 导出面正确性（LIBMINI_API 标注 + 消费者链接）
          - name: ubuntu-shared
            os: ubuntu-latest
            lib_type: shared
          - name: windows-shared
            os: windows-latest
            lib_type: shared
          # 告警升格为错误（当前实现代码必须在 -Wall/-Wextra 下零告警）
          - name: ubuntu-warnings-strict
            os: ubuntu-latest
            warnings_as_errors: true
          # 完整 UAX #29 属性表（-DLIBMINI_UNICODE_FULL_GRAPHEME=ON）：默认的
          # 启发式表之外还有一条编译分支（src/utils/grapheme_tables_full.inc，
          # 由 ci/gen_grapheme_tables.py 从 UCD 生成），之前没有任何 CI 变体编译过
          # 它。这里在两个平台各跑一份：全量 CTest + 安装冒烟，数据驱动的
          # GraphemeTest.Uax29OfficialTestFile 在该模式下要求 853/853 零偏差
          #（启发式模式只白名单放行补充平面的 Indic 连字那一条）。
          # 不复用 Release 基线变体：基线要覆盖用户默认拿到的配置，这条是
          # 另一种构建，单独列出来在 job 名上就看得见
          - name: ubuntu-full-grapheme
            os: ubuntu-latest
            full_grapheme: true
          - name: windows-full-grapheme
            os: windows-latest
            full_grapheme: true

    env:
      # 冒烟消费者与安装树的构建目录（路径含空格风险，统一放工作区根下）
      PREFIX: ${{ github.workspace }}/smoke/prefix

    steps:
      - uses: actions/checkout@v4

      # Windows：激活 MSVC 开发环境（Ninja 生成器下 CMake 找不到 cl.exe，
      # 必须 vcvars 提供 INCLUDE/LIB/PATH）
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'

      - name: Install Conan
        # 先装带 cp313 wheel 的 PyYAML 下限：runner 到 pypi 偶发超时时 pip
        # 可能回退到 PyYAML 5.4.1 源码构建，在 Python 3.13 上撞 Cython 兼容
        # 炸弹（cython_sources AttributeError）。加大超时与重试抗网络抖动。
        run: pip install --timeout 60 --retries 5 "pyyaml>=6.0.1" "conan>=2.0"

      - name: Configure Conan profile
        shell: bash
        run: |
          conan profile detect --force
          p="$(conan profile path default)"
          # 键必须插进已有的 [settings] 段（直接 append 会产生重复 section，
          # conan 直接报错）。注入全部做成幂等：新版 conan detect 可能已自带
          # cppstd（gnu14），重复插入会炸
          # compiler.cppstd 必须存在：cpp-httplib/spdlog 的配方会校验该设置
          #（缺失直接拒装）。14 = gtest 1.15 最低要求（detect 已写 gnu14 的
          # 话直接用）；库本体仍按 CMAKE_CXX_STANDARD=11 编译
          if ! grep -q '^compiler.cppstd=' "$p"; then
            awk '/^\\[settings\\]$/{print; print "compiler.cppstd=14"; next} {print}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
          fi
          # Windows：静态运行库（MT），与消费者 CMAKE_MSVC_RUNTIME_LIBRARY=
          # MultiThreaded 一致（DLL 变体同一运行库，CMakeToolchain 按
          # compiler.runtime 设置 CMP0091 旗标）
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # 逐行覆写而不是 missing 才插入：新版 detect 可能已写 dynamic
            #（run #5 实测：守卫失效后依赖全按 MD 编，消费者 MT 链接报
            # __imp_ 符号缺失）
            awk 'BEGIN{d=0} /^compiler\.runtime=/{print "compiler.runtime=static"; d=1; next} {print} END{if(!d) print "compiler.runtime=static"}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
            printf '\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja\n' >> "$p"
          fi
          conan profile show

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-${{ hashFiles('conanfile.py') }}

      - name: Install dependencies (Conan)
        run: conan install . -of deps --build=missing -s build_type=${{ matrix.build_type || 'Release' }}

      - name: Configure (CMake + Ninja)
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=deps/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }}
          -DCMAKE_INSTALL_PREFIX="$PREFIX"
          -DLIBMINI_BUILD_SWF_VIEWER=OFF
          -DLIBMINI_BUILD_SHARED=${{ matrix.lib_type == 'shared' && 'ON' || 'OFF' }}
          -DLIBMINI_WARNINGS_AS_ERRORS=${{ matrix.warnings_as_errors && 'ON' || 'OFF' }}
          -DLIBMINI_UNICODE_FULL_GRAPHEME=${{ matrix.full_grapheme && 'ON' || 'OFF' }}

      # 开关静默失效是这条变体唯一的假绿方式：若 -D 没真正落到编译命令行，
      # 库会照旧编启发式表，而 GraphemeTest（只看运行期结果）仍会通过
      # ——full 模式要求的 853/853 就形同虚设。这里直接查 ninja 编译数据库：
      # 该定义是 PUBLIC，libmini 与 test_utils 都在用，计数必须 > 0
      - name: Verify the full grapheme table is compiled in
        if: matrix.full_grapheme
        shell: bash
        run: |
          count=$(grep -c 'LIBMINI_UNICODE_FULL_GRAPHEME=1' build/build.ninja || true)
          echo "compile rules carrying LIBMINI_UNICODE_FULL_GRAPHEME=1: $count"
          test "${count:-0}" -gt 0

      - name: Build
        run: cmake --build build --parallel

      - name: CTest
        shell: bash
        run: |
          # Linux 上行缓冲测试进程 stdout：套件被 CTest 超时杀死时，
          # 逐测试输出已实时落盘（gTest 默认全缓冲会全部丢失），
          # 可直接从日志定位真正的慢点。macOS 无 stdbuf，跳过。
          if command -v stdbuf >/dev/null 2>&1; then
            CTEST_BIN="$(command -v ctest)"
            ctest() { stdbuf -oL "$CTEST_BIN" "$@"; }
          fi
          ctest --test-dir build --output-on-failure --timeout 1200

      - name: Install to prefix
        run: cmake --install build

      - name: Smoke consumer (find_package + link + run)
        shell: bash
        # 工具链/前缀必须用绝对路径：CMAKE_TOOLCHAIN_FILE 的相对路径是相对
        # 源目录（ci/smoke_consumer）解析的，deps/ 在源目录下不存在，直接
        # "Could not find toolchain file" 配置失败（run #4 三平台实测）。
        # Windows 上 GITHUB_WORKSPACE 是反斜杠路径，cygpath -m 统一成正斜杠。
        # shared 变体把 DLL 拷到可执行文件旁（保证运行期找到库，比 PATH
        # 操作确定性高）。DLL 名因工具链而异：MinGW liblibmini.dll、
        # MSVC libmini.dll，通配拷贝两者兼容
        run: |
          ws="$GITHUB_WORKSPACE"
          command -v cygpath >/dev/null 2>&1 && ws=$(cygpath -m "$ws")
          cmake -S ci/smoke_consumer -B smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ws/deps/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type || 'Release' }} \
            -DCMAKE_PREFIX_PATH="$ws/smoke/prefix"
          cmake --build smoke/build --parallel
          for dll in "$ws"/smoke/prefix/bin/*libmini*.dll; do
            [ -f "$dll" ] && cp "$dll" smoke/build/
          done
          ./smoke/build/consumer

  # CHANGELOG 漂移闸门 + 构建期脚本自测：未发布段的提交清单必须与 git log 一致，
  # 生成 CHANGELOG / 字形簇属性表的脚本本身也必须先通过自测。
  # 与 build-test 分开跑：这些是秒级的检查，不该和 8 个编译变体抢机器，
  # 但 release.yml 的 ci-gate 要求本工作流**全部** job 全绿，所以它同样是门。
  changelog:
    name: changelog
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 必须完整历史 + tag：区间是 <最近 tag>..HEAD~1，浅克隆拿不到 tag
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 先自测生成器本身：工具坏了的时候，--check 会报「CHANGELOG 漂移」，
      # 那是个误导性结论（真正的原因是工具挂了）
      - name: Self-test the generator
        run: python ci/test_gen_changelog.py

      - name: Unreleased section matches the commit log
        run: python ci/gen_changelog.py --check

      # 同样地：字形簇属性表生成器的解析/合并/渲染与 --check 闸门先自测。
      # 不联网（用内联 UCD 片段），因此没有外部依赖带来的抖动
      - name: Self-test the grapheme table generator
        run: python ci/test_gen_grapheme_tables.py
