name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 上传 Release 产物必需

jobs:
  # 发布门禁：tag 指向的提交必须先过完整 CI（三平台 × Debug/shared/告警
  # 严格 + CTest + 安装冒烟）。uses 调用引用同提交的工作流文件，验证的
  # 代码与实际发布的严格一致；全绿才进入打包，避免发布未经验证的二进制。
  # 被调方的 concurrency group 是 ci-<tag-ref>，与 main push 的
  # ci-refs/heads/main 不同组，不会互相取消
  ci-gate:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    # secrets: 不需要——依赖均来自公开 conan center

  package:
    name: ${{ matrix.name }}
    needs: ci-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x64
            os: ubuntu-latest
            artifact_glob: 'libmini-*-Linux-x64.*'
          - name: macos-arm64
            os: macos-latest
            artifact_glob: 'libmini-*-Darwin-arm64.*'
          - name: windows-x64
            os: windows-latest
            # Windows runner 可能是 x64 或 arm64（CPACK 按处理器判定），
            # 宽松匹配两种后缀
            artifact_glob: 'libmini-*-Windows-*.*'

    env:
      PREFIX: ${{ github.workspace }}/smoke/prefix

    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'

      - name: Install Conan
        # 与 ci.yml 同款加固：pypi 抖动时防 PyYAML 5.4.1 源码构建炸 Python 3.13
        run: pip install --timeout 60 --retries 5 "pyyaml>=6.0.1" "conan>=2.0"

      - name: Configure Conan profile
        shell: bash
        run: |
          conan profile detect --force
          p="$(conan profile path default)"
          if ! grep -q '^compiler.cppstd=' "$p"; then
            awk '/^\[settings\]$/{print; print "compiler.cppstd=14"; next} {print}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
          fi
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            awk 'BEGIN{d=0} /^compiler\.runtime=/{print "compiler.runtime=static"; d=1; next} {print} END{if(!d) print "compiler.runtime=static"}' "$p" > "$p.tmp" && mv "$p.tmp" "$p"
            printf '\n[conf]\ntools.cmake.cmaketoolchain:generator=Ninja\n' >> "$p"
          fi
          conan profile show

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan-${{ matrix.os }}-release-${{ hashFiles('conanfile.py') }}

      - name: Install dependencies (Conan)
        run: conan install . -of deps --build=missing -s build_type=Release

      - name: Configure (CMake + Ninja)
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=deps/conan_toolchain.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX="$PREFIX"
          -DLIBMINI_BUILD_SWF_VIEWER=OFF
          -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Package (CPack)
        shell: bash
        run: |
          cd build
          cpack -G "ZIP;TGZ"
          # 源侧校验和：每包一个 .sha256（sha256sum 标准格式）。artifact 的
          # path 通配 libmini-* 会一并带上海绵的 .sha256，供 publish 阶段
          # 验证 artifact 传输完整性，消费者也可单独下载核对
          for f in libmini-*.zip libmini-*.tar.gz; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done
          ls -la libmini-*
          cat libmini-*.sha256

      - name: Smoke consumer (find_package + link + run)
        shell: bash
        # 发布前的最后验证：安装树可被下游 find_package 消费。
        # 测试已在 CI 矩阵覆盖（同 commit 的 ci.yml 全绿是打 tag 的前提），
        # 这里只装包 + 冒烟，不重复跑全套测试
        run: |
          ws="$GITHUB_WORKSPACE"
          command -v cygpath >/dev/null 2>&1 && ws=$(cygpath -m "$ws")
          cmake --install build
          cmake -S ci/smoke_consumer -B smoke/build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ws/deps/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$ws/smoke/prefix"
          cmake --build smoke/build --parallel
          for dll in "$ws"/smoke/prefix/bin/*libmini*.dll; do
            [ -f "$dll" ] && cp "$dll" smoke/build/
          done
          ./smoke/build/consumer

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: build/libmini-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [ci-gate, package]
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Verify package checksums (artifact transfer integrity)
        # artifact 在 upload/download 间由 GitHub 中转，先逐包核对源侧
        # 校验和：任何包损坏/缺失/被塞入多余文件都在发布前拦截
        run: |
          cd dist
          ls -la
          shopt -s nullglob
          sums=(*.sha256)
          [ ${#sums[@]} -ge 6 ] || { echo "expected >=6 checksum files, got ${#sums[@]}"; exit 1; }
          sha256sum -c "${sums[@]}"
          # 内部校验和使命完成，删除后生成发布总清单（文件名 + 哈希）
          rm -f "${sums[@]}"
          pkgs=(libmini-*)
          [ ${#pkgs[@]} -ge 6 ] || { echo "expected >=6 packages, got ${#pkgs[@]}"; exit 1; }
          sha256sum "${pkgs[@]}" > SHA256SUMS
          # 自校验：确保总清单可完整验证全部产物
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release and upload packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          # 显式列出上架物：三平台 ZIP/TGZ + 校验和总清单。SHA256SUMS
          # 让消费者下载后可 sha256sum -c 核对完整性
          files: |
            dist/libmini-*.zip
            dist/libmini-*.tar.gz
            dist/SHA256SUMS
          fail_on_unmatched_files: true
